version: "3.9"

services:
  nexus-server:
    image: registry.cn-guangzhou.aliyuncs.com/knodio/nexus
    container_name: nexus-server
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - nexus-data:/app/data
      - nexus-logs:/app/logs
      - ./configs:/app/configs:ro
    environment:
      - TZ=Asia/Shanghai
      - NEXUS_SERVER_HOST=0.0.0.0
      - NEXUS_SERVER_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  nexus-data:
  nexus-logs:
