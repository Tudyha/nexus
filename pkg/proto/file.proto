syntax = "proto3";

package nexus.pkg;

option go_package = "github.com/Tudyha/nexus/pkg/proto/proto";

message FileListReq {
  string path = 1;
}

message File {
  string name       = 1;
  int64  size       = 2;
  int64  mod_time   = 3;
  string mode       = 4;
  bool   is_dir     = 5;
  string owner      = 6;
  string group      = 7;
}

message FileListResp {
  repeated File entries = 1;
}

message FileDownloadReq {
  string path   = 1;
  int64  offset = 2;
  int64  limit  = 3;
}

message FileDownloadResp {
  bytes data       = 1;
  int64 total_size = 2;
}

message FileUploadReq {
  string path = 1;
  bytes  data = 2;
  bool   append = 3;
}

message FileDeleteReq {
  string path = 1;
}

message FileMkdirReq {
  string path = 1;
}

message FileRenameReq {
  string old_path = 1;
  string new_path = 2;
}
