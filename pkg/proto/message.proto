syntax = "proto3";

package nexus.pkg;

option go_package = "github.com/Tudyha/nexus/pkg/proto/proto";

import "common.proto";

message Message {
  string      id        = 1; // 消息ID
  int64       timestamp = 2; // 消息时间戳
  MessageType type      = 3; // 消息类型
  bytes       payload   = 4; // 消息数据
}

message Response {
  ErrorCode code = 1; // 错误码
  string    msg  = 2; // 错误信息
  bytes     data = 3; // 响应数据
}
